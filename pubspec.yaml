name: tt_running_app
description: "날씨·미세먼지 기반 운동 시간 추천 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 날씨 배경 애니메이션
  lottie: ^3.3.1

  # API 통신
  http: ^1.2.2

  # 위치 (GPS)
  geolocator: ^13.0.4
  geocoding: ^3.0.0

  # 설정 저장 (로컬)
  shared_preferences: ^2.3.5

  # 홈 위젯
  home_widget: ^0.7.0

  # 백그라운드 작업 (위젯 자동 갱신)
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Riverpod 코드 자동생성
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
